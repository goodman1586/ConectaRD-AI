<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repartidor · ConectaRD AI</title><link rel="stylesheet" href="/common.css"></head><body>
<header><b>ConectaRD AI</b><span>🚴 Panel del repartidor</span></header><main>
<section id="login" class="card"><h1>🚴 Acceso del repartidor</h1><p class="muted">Usa el ID del negocio, tu ID (ej. DR-48231) y tu código de acceso de 5 dígitos.</p>
  <input id="bid" placeholder="ID del negocio"><input id="did" placeholder="ID del repartidor (ej. DR-48231)">
  <input id="code" type="password" inputmode="numeric" maxlength="5" placeholder="Código de acceso" autocomplete="one-time-code">
  <button class="primary" id="enter" type="button">Entrar</button><p id="err" class="error"></p></section>
<section id="app" class="hidden"><div class="card"><div class="row between"><div><h1>🚴 Mis entregas</h1><p id="who" class="muted"></p></div>
  <div class="row"><span id="availability" class="pill">Disponible</span><button class="soft" id="toggleAvail" type="button">⏸ No disponible</button><button class="soft" id="notify" type="button">🔔 Activar notificaciones</button><button class="soft" id="logout" type="button">Salir</button></div></div></div>
  <div id="orders"></div></section>
</main>
<script src="/js/common.js"></script><script src="/js/repartidor.js"></script>
</body></html>
