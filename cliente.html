<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cliente · ConectaRD AI</title><link rel="stylesheet" href="/common.css"></head><body>
<header><b>ConectaRD AI</b><span>🛒 Cliente</span></header><main>
<div id="tracker" class="tracker hidden"></div>
<section class="card" id="business-picker"><div class="row between"><h1>🛍️ Elige un negocio</h1><div class="carousel-controls"><button class="soft" type="button" data-scroll="business-track" data-direction="-1" aria-label="Negocios anteriores">←</button><button class="soft" type="button" data-scroll="business-track" data-direction="1" aria-label="Más negocios">→</button></div></div><div id="business-track" class="business-track" aria-label="Negocios disponibles"></div></section>
<div id="storefront" class="hidden">
<div id="business" class="card"></div>
<div id="promo" class="card hidden"></div>
<div class="card"><h2>🛒 Catálogo</h2><div id="products"></div></div>
<div id="juice-section" class="card hidden"><h2>🥤 Jugos</h2><div id="juices"></div></div>
<div class="grid">
  <div class="card"><h2>🧾 Tu pedido</h2><div id="cart"></div><p class="total">Total: <b id="total">RD$0</b></p></div>
  <div class="card"><h2>📍 Datos de entrega</h2>
    <input id="customer" placeholder="Nombre del cliente" maxlength="80" autocomplete="name">
    <input id="phone" placeholder="WhatsApp / teléfono" maxlength="30" inputmode="tel" autocomplete="tel">
    <button class="primary" id="gps" type="button">📍 Compartir mi ubicación</button>
    <p id="gpsmsg" class="muted">Ubicación pendiente.</p>
    <input id="address" placeholder="Dirección, sector, referencia" maxlength="300">
    <button class="soft" id="maps" type="button">🗺️ Abrir Google Maps</button>
    <textarea id="notes" placeholder="Instrucciones para el repartidor" maxlength="500"></textarea>
    <button class="green" id="order" type="button">🚚 Confirmar pedido</button>
    <div id="msg" class="muted" aria-live="polite"></div>
  </div>
</div>
<div class="card"><h2>🤖 IA del negocio</h2><div id="chat" class="chat"></div>
  <div class="row"><input id="question" placeholder="Pregunta sobre productos, precios, dirección..." maxlength="500" style="margin:0;flex:1"><button class="primary" id="ask" type="button">Preguntar</button></div></div>
</div>
</main>
<script src="/js/common.js"></script><script src="/js/cliente.js"></script>
</body></html>
